name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Panel syntax and segmentation tests
        run: |
          cp panel/BanglaCaption.jsx /tmp/panel.js
          node --check /tmp/panel.js
          node tests/test_segment.js
      - name: Worker and version tests
        run: python tests/test_worker.py

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build installer
        shell: pwsh
        run: |
          $v = (Get-Content VERSION).Trim()
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" installer\BanglaCaption.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
      - name: Portable zip
        shell: pwsh
        run: |
          $v = (Get-Content VERSION).Trim()
          New-Item -ItemType Directory -Force -Path stage\BanglaCaption | Out-Null
          foreach ($i in 'panel','worker','assets','tools','INSTALL.bat','UNINSTALL.bat','README.md','LICENSE','CHANGELOG.md','VERSION') {
            Copy-Item $i stage\BanglaCaption -Recurse -Force
          }
          Compress-Archive -Path stage\BanglaCaption -DestinationPath "dist\BanglaCaption-portable-$v.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: BanglaCaption
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: BanglaCaption, path: dist }
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
